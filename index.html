<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نظام جرد الأقمشة | رويال – نادي الأناقة الملكي</title>
  <meta name="description" content="نظام جرد الأقمشة لرويال: تسجيل كروت الأقمشة والسحوبات والجرد الفعلي مع تنبيهات المخزون المنخفض والسالب.">
  <!-- Internal business tool: keep it out of search results. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

  <header class="masthead">
    <div class="masthead__inner container">
      <div class="brand">
        <svg class="brand__crown" aria-hidden="true"><use href="#i-crown"/></svg>
        <span class="brand__name" data-i18n="brandName">رويال</span>
        <span class="brand__tag" data-i18n="brandTag">نادي الأناقة الملكي</span>
      </div>
      <div class="masthead__title">
        <h1 data-i18n="appTitle">نظام جرد الأقمشة</h1>
        <p data-i18n="appTagline">إدارة دقيقة لمخزون الأقمشة… بسهولة واحترافية</p>
      </div>
      <div class="masthead__tools">
        <span class="save-status" id="saveStatus" role="status" aria-live="polite"><span class="dot"></span><span class="save-status__text" data-i18n="saved">محفوظ</span></span>
        <button type="button" class="btn btn--ghost btn--sm" id="langToggle" lang="en">
          <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
          <span data-i18n="langSwitch">English</span>
        </button>
      </div>
    </div>
    <nav class="tabs container" aria-label="Main">
      <div class="tabs__list" role="tablist">
        <button type="button" role="tab" class="tab" id="tab-dashboard" aria-controls="panel-dashboard" aria-selected="true" data-tab="dashboard">
          <svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span data-i18n="tabDashboard">لوحة التحكم</span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-withdrawals" aria-controls="panel-withdrawals" aria-selected="false" tabindex="-1" data-tab="withdrawals">
          <svg class="icon" aria-hidden="true"><use href="#i-scissors"/></svg><span data-i18n="tabWithdrawals">صفحة السحوبات</span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-inventory" aria-controls="panel-inventory" aria-selected="false" tabindex="-1" data-tab="inventory">
          <svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg><span data-i18n="tabInventory">صفحة الجرد</span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-history" aria-controls="panel-history" aria-selected="false" tabindex="-1" data-tab="history">
          <svg class="icon" aria-hidden="true"><use href="#i-history"/></svg><span data-i18n="tabHistory">السجل والأرشيف</span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-guide" aria-controls="panel-guide" aria-selected="false" tabindex="-1" data-tab="guide">
          <svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span data-i18n="tabGuide">دليل الاستخدام</span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1" data-tab="settings">
          <svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg><span data-i18n="tabSettings">الإعدادات</span>
        </button>
      </div>
    </nav>
  </header>

  <main id="main" class="container" tabindex="-1">

    <!-- ============ DASHBOARD ============ -->
    <section id="panel-dashboard" role="tabpanel" aria-labelledby="tab-dashboard" class="panel-view">
      <h2 class="visually-hidden" data-i18n="tabDashboard">لوحة التحكم</h2>
      <div id="emptyState" class="empty-hero" hidden>
        <svg class="empty-hero__icon" aria-hidden="true"><use href="#i-layers"/></svg>
        <h3 data-i18n="emptyTitle"></h3>
        <p data-i18n="emptyBody"></p>
        <div class="btn-row">
          <button type="button" class="btn btn--gold" data-action="add-card"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="addCard"></span></button>
          <button type="button" class="btn btn--ghost" data-action="goto-settings"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="importCards"></span></button>
          <button type="button" class="btn btn--link" data-action="load-demo" data-i18n="loadDemo"></button>
        </div>
      </div>

      <ul class="kpis" id="kpis" aria-label="KPIs"></ul>

      <div class="dash-grid">
        <section class="card-panel" aria-labelledby="lookupTitle">
          <header class="card-panel__head">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <h3 id="lookupTitle" data-i18n="searchCard">بحث برقم الكارت</h3>
          </header>
          <form class="lookup" id="lookupForm" role="search">
            <label class="visually-hidden" for="lookupInput" data-i18n="searchCard"></label>
            <input class="input" id="lookupInput" list="cardList" autocomplete="off" data-i18n-ph="searchCardPh" inputmode="text">
            <button class="btn btn--gold" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span data-i18n="search">بحث</span></button>
          </form>
          <div id="lookupResult" class="lookup-result" aria-live="polite"></div>
        </section>

        <section class="card-panel" aria-labelledby="attTitle">
          <header class="card-panel__head">
            <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
            <h3 id="attTitle" data-i18n="attention">تحتاج إلى متابعة</h3>
          </header>
          <div id="attention"></div>
        </section>
      </div>

      <section class="card-panel" aria-labelledby="itemsTitle">
        <header class="card-panel__head card-panel__head--split">
          <div class="card-panel__title">
            <svg class="icon" aria-hidden="true"><use href="#i-tag"/></svg>
            <h3 id="itemsTitle" data-i18n="searchItem">بحث وتجميع برقم الصنف</h3>
            <span class="pill" id="itemsCount"></span>
          </div>
          <div class="search-field">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <label class="visually-hidden" for="itemSearch" data-i18n="searchItem"></label>
            <input class="input" id="itemSearch" type="search" autocomplete="off" data-i18n-ph="searchItemPh">
          </div>
        </header>
        <div class="table-wrap">
          <table class="table table--items">
            <thead><tr>
              <th scope="col" data-i18n="itemNo"></th>
              <th scope="col" data-i18n="fabricName"></th>
              <th scope="col" data-i18n="origin"></th>
              <th scope="col" class="num" data-i18n="cardsCount"></th>
              <th scope="col" class="num" data-i18n="openingStock"></th>
              <th scope="col" class="num" data-i18n="totalWithdrawals"></th>
              <th scope="col" class="num" data-i18n="finalStock"></th>
              <th scope="col" data-i18n="stockAlert"></th>
            </tr></thead>
            <tbody id="itemsBody"></tbody>
          </table>
        </div>
        <div class="pager" id="itemsPager"></div>
      </section>
    </section>

    <!-- ============ WITHDRAWALS ============ -->
    <section id="panel-withdrawals" role="tabpanel" aria-labelledby="tab-withdrawals" class="panel-view" hidden>
      <h2 class="visually-hidden" data-i18n="tabWithdrawals"></h2>
      <section class="card-panel card-panel--form" aria-labelledby="wFormTitle">
        <header class="card-panel__head">
          <svg class="icon" aria-hidden="true"><use href="#i-scissors"/></svg>
          <h3 id="wFormTitle" data-i18n="registerMovement">تسجيل سحب جديد</h3>
        </header>
        <form id="wForm" class="w-form" novalidate>
          <div class="field">
            <label for="wDate" data-i18n="wDate"></label>
            <input class="input" type="date" id="wDate" name="date" required>
          </div>
          <div class="field field--card">
            <label for="wCard" data-i18n="cardNo"></label>
            <input class="input" id="wCard" name="cardNo" list="cardList" autocomplete="off" required data-i18n-ph="selectCard" aria-describedby="wCardMsg">
            <p class="field__msg" id="wCardMsg"></p>
          </div>
          <div class="field">
            <label for="wItemNo"><span data-i18n="itemNo"></span> <small data-i18n="autoFillHint"></small></label>
            <input class="input" id="wItemNo" name="itemNo" list="itemList" autocomplete="off">
          </div>
          <div class="field">
            <label for="wName"><span data-i18n="fabricName"></span> <small data-i18n="autoFillHint"></small></label>
            <input class="input" id="wName" name="name" autocomplete="off">
          </div>
          <div class="field">
            <label for="wOrigin"><span data-i18n="origin"></span> <small data-i18n="autoFillHint"></small></label>
            <input class="input" id="wOrigin" name="origin" list="originList" autocomplete="off">
          </div>
          <div class="field">
            <label for="wQty" data-i18n="wQty"></label>
            <input class="input input--num" type="number" id="wQty" name="qty" min="0.01" step="0.01" inputmode="decimal" required placeholder="0.00" aria-describedby="wQtyMsg">
            <p class="field__msg" id="wQtyMsg"></p>
          </div>
          <div class="field field--notes">
            <label for="wNotes" data-i18n="wNotes"></label>
            <input class="input" id="wNotes" name="notes" autocomplete="off" data-i18n-ph="notesPh">
          </div>
          <div class="field field--submit">
            <div class="avail" id="wAvail" aria-live="polite"></div>
            <button class="btn btn--gold btn--lg" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="addWithdrawal">إضافة السحب</span></button>
          </div>
        </form>
      </section>

      <section class="card-panel" aria-labelledby="logTitle">
        <header class="card-panel__head card-panel__head--split">
          <div class="card-panel__title">
            <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>
            <h3 id="logTitle" data-i18n="movementLog">سجل السحوبات</h3>
            <span class="pill" id="logCount"></span>
          </div>
          <div class="toolbar">
            <div class="search-field">
              <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
              <label class="visually-hidden" for="logSearch" data-i18n="search"></label>
              <input class="input" id="logSearch" type="search" autocomplete="off" data-i18n-ph="searchLogPh">
            </div>
            <label class="visually-hidden" for="logOrigin" data-i18n="origin"></label>
            <select class="input select" id="logOrigin"></select>
            <label class="date-filter"><span data-i18n="dateFrom"></span><input class="input" type="date" id="logFrom"></label>
            <label class="date-filter"><span data-i18n="dateTo"></span><input class="input" type="date" id="logTo"></label>
            <button type="button" class="btn btn--ghost btn--sm" data-action="export-withdrawals"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="exportCsv"></span></button>
          </div>
        </header>
        <div class="table-wrap">
          <table class="table table--log">
            <thead><tr>
              <th scope="col" data-i18n="wId"></th>
              <th scope="col" data-i18n="wDate"></th>
              <th scope="col" data-i18n="cardNo"></th>
              <th scope="col" data-i18n="itemNo"></th>
              <th scope="col" data-i18n="fabricName"></th>
              <th scope="col" data-i18n="origin"></th>
              <th scope="col" class="num" data-i18n="wQty"></th>
              <th scope="col" class="num" data-i18n="wCardAfter"></th>
              <th scope="col" class="num" data-i18n="wItemTotal"></th>
              <th scope="col" data-i18n="wNotes"></th>
              <th scope="col"><span class="visually-hidden" data-i18n="actions"></span></th>
            </tr></thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>
        <div class="pager" id="logPager"></div>
      </section>
    </section>

    <!-- ============ INVENTORY ============ -->
    <section id="panel-inventory" role="tabpanel" aria-labelledby="tab-inventory" class="panel-view" hidden>
      <h2 class="visually-hidden" data-i18n="tabInventory"></h2>
      <section class="card-panel" aria-labelledby="invTitle">
        <header class="card-panel__head card-panel__head--split">
          <div class="card-panel__title">
            <svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg>
            <h3 id="invTitle" data-i18n="inventoryTable">كروت الأقمشة</h3>
            <span class="pill" id="invCount"></span>
          </div>
          <div class="toolbar">
            <div class="search-field">
              <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
              <label class="visually-hidden" for="invSearch" data-i18n="search"></label>
              <input class="input" id="invSearch" type="search" autocomplete="off" data-i18n-ph="searchInvPh">
            </div>
            <label class="visually-hidden" for="invOrigin" data-i18n="origin"></label>
            <select class="input select" id="invOrigin"></select>
            <label class="visually-hidden" for="invStatus" data-i18n="stockAlert"></label>
            <select class="input select" id="invStatus"></select>
            <button type="button" class="btn btn--ghost btn--sm" data-action="export-cards"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="exportCsv"></span></button>
            <button type="button" class="btn btn--gold btn--sm" data-action="add-card"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="addCard"></span></button>
          </div>
        </header>
        <div class="table-wrap">
          <table class="table table--inv">
            <thead><tr>
              <th scope="col" data-i18n="cardNo"></th>
              <th scope="col" data-i18n="entryDate"></th>
              <th scope="col" data-i18n="itemNo"></th>
              <th scope="col" data-i18n="fabricName"></th>
              <th scope="col" data-i18n="origin"></th>
              <th scope="col" class="num" data-i18n="openingStock"></th>
              <th scope="col" class="num" data-i18n="totalWithdrawals"></th>
              <th scope="col" class="num" data-i18n="calcBalance"></th>
              <th scope="col" class="num" data-i18n="physicalCount"></th>
              <th scope="col" class="num" data-i18n="finalStock"></th>
              <th scope="col" class="num" data-i18n="variance"></th>
              <th scope="col" data-i18n="stockAlert"></th>
              <th scope="col" data-i18n="physicalDate"></th>
              <th scope="col"><span class="visually-hidden" data-i18n="actions"></span></th>
            </tr></thead>
            <tbody id="invBody"></tbody>
          </table>
        </div>
        <div class="pager" id="invPager"></div>
      </section>
    </section>

    <!-- ============ HISTORY ============ -->
    <section id="panel-history" role="tabpanel" aria-labelledby="tab-history" class="panel-view" hidden>
      <h2 class="visually-hidden" data-i18n="tabHistory"></h2>
      <section class="card-panel" aria-labelledby="asOfTitle">
        <header class="card-panel__head card-panel__head--split">
          <div class="card-panel__title">
            <svg class="icon" aria-hidden="true"><use href="#i-history"/></svg>
            <h3 id="asOfTitle" data-i18n="asOfTitle"></h3>
          </div>
          <div class="toolbar">
            <label class="date-filter"><span data-i18n="asOfDate"></span><input class="input" type="date" id="asOfDate"></label>
            <div class="search-field">
              <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
              <label class="visually-hidden" for="asOfSearch" data-i18n="search"></label>
              <input class="input" id="asOfSearch" type="search" autocomplete="off" data-i18n-ph="searchInvPh">
            </div>
            <button type="button" class="btn btn--ghost btn--sm" data-action="export-asof"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="exportCsv"></span></button>
          </div>
        </header>
        <p class="muted panel-intro" data-i18n="asOfIntro"></p>
        <p class="summary-strip" id="asOfSummary"></p>
        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th scope="col" data-i18n="cardNo"></th>
              <th scope="col" data-i18n="itemNo"></th>
              <th scope="col" data-i18n="fabricName"></th>
              <th scope="col" data-i18n="origin"></th>
              <th scope="col" class="num" data-i18n="openingStock"></th>
              <th scope="col" class="num" data-i18n="asOfWithdrawn"></th>
              <th scope="col" class="num" data-i18n="asOfBalance"></th>
              <th scope="col" data-i18n="stockAlert"></th>
            </tr></thead>
            <tbody id="asOfBody"></tbody>
          </table>
        </div>
        <div class="pager" id="asOfPager"></div>
      </section>

      <section class="card-panel" aria-labelledby="periodTitle">
        <header class="card-panel__head card-panel__head--split">
          <div class="card-panel__title">
            <svg class="icon" aria-hidden="true"><use href="#i-scissors"/></svg>
            <h3 id="periodTitle" data-i18n="periodTitle"></h3>
          </div>
          <div class="toolbar">
            <label class="date-filter"><span data-i18n="dateFrom"></span><input class="input" type="date" id="periodFrom"></label>
            <label class="date-filter"><span data-i18n="dateTo"></span><input class="input" type="date" id="periodTo"></label>
            <button type="button" class="btn btn--ghost btn--sm" data-action="export-period"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="exportCsv"></span></button>
          </div>
        </header>
        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th scope="col" data-i18n="itemNo"></th>
              <th scope="col" data-i18n="fabricName"></th>
              <th scope="col" data-i18n="origin"></th>
              <th scope="col" class="num" data-i18n="periodCount"></th>
              <th scope="col" class="num" data-i18n="cardsCount"></th>
              <th scope="col" class="num" data-i18n="wQty"></th>
            </tr></thead>
            <tbody id="periodBody"></tbody>
          </table>
        </div>
      </section>

      <div class="dash-grid">
        <section class="card-panel" aria-labelledby="cloudHistTitle">
          <header class="card-panel__head"><svg class="icon" aria-hidden="true"><use href="#i-cloud"/></svg><h3 id="cloudHistTitle" data-i18n="cloudHistoryTitle"></h3></header>
          <p class="muted panel-intro" data-i18n="cloudHistoryIntro"></p>
          <div id="cloudHistory"></div>
        </section>
        <section class="card-panel" aria-labelledby="trashTitle">
          <header class="card-panel__head"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg><h3 id="trashTitle" data-i18n="trashTitle"></h3></header>
          <p class="muted panel-intro" data-i18n="trashIntro"></p>
          <div id="trashList"></div>
        </section>
      </div>
    </section>

    <!-- ============ GUIDE ============ -->
    <section id="panel-guide" role="tabpanel" aria-labelledby="tab-guide" class="panel-view" hidden>
      <div class="guide" id="guide"></div>
    </section>

    <!-- ============ SETTINGS ============ -->
    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" class="panel-view" hidden>
      <h2 class="visually-hidden" data-i18n="tabSettings"></h2>
      <div class="settings-grid">
        <section class="card-panel card-panel--cloud" aria-labelledby="setCloudTitle">
          <header class="card-panel__head"><svg class="icon" aria-hidden="true"><use href="#i-cloud"/></svg><h3 id="setCloudTitle" data-i18n="cloudTitle"></h3></header>
          <div class="stack" id="cloudPanel"></div>
        </section>
        <section class="card-panel" aria-labelledby="setAlertTitle">
          <header class="card-panel__head"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><h3 id="setAlertTitle" data-i18n="settingsGeneral"></h3></header>
          <form id="settingsForm" class="stack">
            <div class="field">
              <label for="setThreshold" data-i18n="lowThreshold"></label>
              <input class="input input--num" type="number" id="setThreshold" min="0" step="0.01" inputmode="decimal" aria-describedby="setThresholdHelp" required>
              <p class="field__help" id="setThresholdHelp" data-i18n="lowThresholdHelp"></p>
            </div>
            <div class="field">
              <label for="setUser" data-i18n="userName"></label>
              <input class="input" id="setUser" autocomplete="name" aria-describedby="setUserHelp">
              <p class="field__help" id="setUserHelp" data-i18n="userNameHelp"></p>
            </div>
            <button class="btn btn--gold" type="submit" data-i18n="saveSettings"></button>
          </form>
        </section>

        <section class="card-panel" aria-labelledby="setDataTitle">
          <header class="card-panel__head"><svg class="icon" aria-hidden="true"><use href="#i-database"/></svg><h3 id="setDataTitle" data-i18n="dataTitle"></h3></header>
          <div class="stack">
            <p class="muted" data-i18n="dataBody"></p>
            <div class="btn-row">
              <button type="button" class="btn btn--gold" data-action="backup"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="backupExport"></span></button>
              <label class="btn btn--ghost file-btn"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="backupImport"></span><input type="file" accept=".json,application/json" data-import="backup"></label>
            </div>
            <hr class="rule">
            <p class="muted" data-i18n="importHelp"></p>
            <div class="btn-row">
              <label class="btn btn--ghost file-btn"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="importCardsCsv"></span><input type="file" accept=".csv,text/csv" data-import="cards"></label>
              <label class="btn btn--ghost file-btn"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="importWithdrawalsCsv"></span><input type="file" accept=".csv,text/csv" data-import="withdrawals"></label>
            </div>
            <div class="btn-row">
              <button type="button" class="btn btn--link" data-action="template-cards"><span data-i18n="downloadTemplate"></span> — <span data-i18n="templateCards"></span></button>
              <button type="button" class="btn btn--link" data-action="template-withdrawals"><span data-i18n="downloadTemplate"></span> — <span data-i18n="templateWithdrawals"></span></button>
            </div>
          </div>
        </section>

        <section class="card-panel card-panel--danger" aria-labelledby="setDangerTitle">
          <header class="card-panel__head"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg><h3 id="setDangerTitle" data-i18n="dangerZone"></h3></header>
          <div class="btn-row">
            <button type="button" class="btn btn--link" data-action="load-demo" data-i18n="loadDemo"></button>
            <button type="button" class="btn btn--danger" data-action="reset" data-i18n="resetData"></button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p><svg class="icon" aria-hidden="true"><use href="#i-crown"/></svg> © <span id="year"></span> <span data-i18n="brandName"></span> — <span data-i18n="brandTag"></span> · <span data-i18n="rights"></span></p>
      <p class="site-footer__meta">
        <span><span data-i18n="totalMovements"></span>: <strong id="footMovements" class="ltr-num">0</strong></span>
        <span><span data-i18n="lastUpdate"></span>: <strong id="footUpdated" class="ltr-num">—</strong></span>
      </p>
    </div>
  </footer>

  <datalist id="cardList"></datalist>
  <datalist id="originList"></datalist>
  <datalist id="itemList"></datalist>

  <!-- Card add/edit dialog -->
  <dialog class="dialog" id="cardDialog" aria-labelledby="cardDialogTitle">
    <form method="dialog" id="cardForm" novalidate>
      <header class="dialog__head">
        <h2 id="cardDialogTitle"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <div class="dialog__body form-grid">
        <p class="count-ref form-note" id="cardNote" role="status" hidden></p>
        <input type="hidden" name="id">
        <div class="field">
          <label for="cCardNo" data-i18n="cardNo"></label>
          <input class="input" id="cCardNo" name="cardNo" required autocomplete="off" aria-describedby="cCardNoMsg">
          <p class="field__msg" id="cCardNoMsg"></p>
        </div>
        <div class="field">
          <label for="cEntry" data-i18n="entryDate"></label>
          <input class="input" type="date" id="cEntry" name="entryDate" required>
        </div>
        <div class="field">
          <label for="cItemNo" data-i18n="itemNo"></label>
          <input class="input" id="cItemNo" name="itemNo" list="itemList" required autocomplete="off" aria-describedby="cItemNoMsg">
          <p class="field__msg" id="cItemNoMsg"></p>
        </div>
        <div class="field">
          <label for="cName" data-i18n="fabricName"></label>
          <input class="input" id="cName" name="name" required autocomplete="off" aria-describedby="cNameMsg">
          <p class="field__msg" id="cNameMsg"></p>
        </div>
        <div class="field">
          <label for="cOrigin" data-i18n="origin"></label>
          <input class="input" id="cOrigin" name="origin" list="originList" autocomplete="off">
        </div>
        <div class="field">
          <label for="cOpening" data-i18n="openingStock"></label>
          <input class="input input--num" type="number" id="cOpening" name="opening" min="0" step="0.01" inputmode="decimal" required aria-describedby="cOpeningMsg">
          <p class="field__msg" id="cOpeningMsg"></p>
        </div>
      </div>
      <footer class="dialog__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn--gold" value="save" data-i18n="saveCard"></button>
      </footer>
    </form>
  </dialog>

  <!-- Physical count dialog -->
  <dialog class="dialog dialog--sm" id="countDialog" aria-labelledby="countDialogTitle">
    <form method="dialog" id="countForm" novalidate>
      <header class="dialog__head">
        <h2 id="countDialogTitle"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <div class="dialog__body stack">
        <input type="hidden" name="id">
        <p class="count-ref" id="countRef"></p>
        <div class="field">
          <label for="pCount" data-i18n="physicalCount"></label>
          <input class="input input--num" type="number" id="pCount" name="physical" min="0" step="0.01" inputmode="decimal" required aria-describedby="pCountMsg">
          <p class="field__msg" id="pCountMsg"></p>
        </div>
        <div class="field">
          <label for="pDate" data-i18n="physicalDate"></label>
          <input class="input" type="date" id="pDate" name="physicalDate" required>
        </div>
      </div>
      <footer class="dialog__foot">
        <button type="button" class="btn btn--link" id="clearCount" data-i18n="clearCount"></button>
        <span class="spacer"></span>
        <button type="button" class="btn btn--ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn--gold" value="save" data-i18n="saveCount"></button>
      </footer>
    </form>
  </dialog>

  <!-- Withdrawal edit dialog -->
  <dialog class="dialog dialog--sm" id="wDialog" aria-labelledby="wDialogTitle">
    <form method="dialog" id="wEditForm" novalidate>
      <header class="dialog__head">
        <h2 id="wDialogTitle"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <div class="dialog__body stack">
        <input type="hidden" name="id">
        <div class="field">
          <label for="eDate" data-i18n="wDate"></label>
          <input class="input" type="date" id="eDate" name="date" required>
        </div>
        <div class="field">
          <label for="eCard" data-i18n="cardNo"></label>
          <input class="input" id="eCard" name="cardNo" list="cardList" required autocomplete="off" aria-describedby="eCardMsg">
          <p class="field__msg" id="eCardMsg"></p>
        </div>
        <div class="field">
          <label for="eItemNo" data-i18n="itemNo"></label>
          <input class="input" id="eItemNo" name="itemNo" list="itemList" autocomplete="off">
        </div>
        <div class="field">
          <label for="eName" data-i18n="fabricName"></label>
          <input class="input" id="eName" name="name" autocomplete="off">
        </div>
        <div class="field">
          <label for="eOrigin" data-i18n="origin"></label>
          <input class="input" id="eOrigin" name="origin" list="originList" autocomplete="off">
        </div>
        <div class="field">
          <label for="eQty" data-i18n="wQty"></label>
          <input class="input input--num" type="number" id="eQty" name="qty" min="0.01" step="0.01" inputmode="decimal" required aria-describedby="eQtyMsg">
          <p class="field__msg" id="eQtyMsg"></p>
        </div>
        <div class="field">
          <label for="eNotes" data-i18n="wNotes"></label>
          <input class="input" id="eNotes" name="notes" autocomplete="off">
        </div>
      </div>
      <footer class="dialog__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn--gold" value="save" data-i18n="saveWithdrawal"></button>
      </footer>
    </form>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
